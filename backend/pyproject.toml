[project]
name = "harness-agent"
version = "0.1.0"
description = "Local coding agent harness (CLI + Desktop) built on deepagents"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = { text = "MIT" }
authors = [{ name = "harness" }]
keywords = ["agent", "deepagents", "langgraph", "cli", "desktop"]
dependencies = [
    "deepagents>=0.7.0",
    "langchain>=1.0.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint>=2.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "textual>=1.0.0",
    "websockets>=14.0",
    "httpx>=0.28.0",
    "langchain-openai>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]
sandbox = [
    "docker>=7.1.0",
]
persist = [
    "langgraph-checkpoint-sqlite>=2.0.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
harness = "harness_cli.main:main"
harness-server = "server.app:main"

[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = [".", "cli"]
include = ["protocol*", "agent*", "server*", "config", "harness_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = [".", "cli"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
